# outreach-scheduler global configuration (example — copy to global.yaml and edit)
# English primary, Chinese secondary (中文注释为辅).
#
# User data NEVER lives in this repo: data_root points outside, or the
# repo-local data/ directory which is fully gitignored.

data_root: data                    # repo-local (gitignored) or e.g. ~/outreach-scheduler-data

sources:
  # Import sources. WDC-style harvested data + similar datasets.
  # workbench targets.jsonl / prospector store are intentionally NOT sources.
  # Convention: copy the referenced data files into data/sources/ first —
  # the project reads only what lives under data_root (gitignored).
  wdc_competitor_links:
    glob: "data/sources/competitor-links-*.json"
  # Discovery-layer snapshot from the WDC co-link/outlink graph. Prepare it
  # with import/prepare_discovery_snapshot.py --input <snapshot.json>;
  # rows still need probe/classify before they can be queued.
  wdc_discovery_snapshot:
    glob: "data/sources/wdc-discovery-*.json"
    snapshot: "wdc-v0.3"           # stamped into every record's hints/evidence
  # similar: []                    # future adapters, one block each
  exclude:
    - workbench_jsonl
    - prospector_store

# Read-only topology manifest exported by import/prepare_discovery_topology.py
topology:
  version: "0.3"

scheduler:
  run_at: "09:30"
  timezone: Asia/Shanghai

report:
  email: ""                        # empty = no daily report email; set to enable
  smtp_env_file: config/secrets/smtp.env   # project-local, gitignored
  # SMTP endpoint — either here or SMTP_HOST/SMTP_PORT in the env file:
  # smtp_host: smtp.gmail.com
  # smtp_port: 587

# Customer-facing identity. Used for mail from-labels (report / verify alerts /
# portal verification) and the public privacy URL, so a rename is one line
# instead of a hunt through the source. Both are also settable via env:
# PORTAL_BRAND and PORTAL_BASE_URL.
portal:
  brand: outreach-scheduler         # public product name shown to customers
  base_url: ""                      # e.g. https://example.com (portal + receipts)
  # frontend_url: ""                # SPA origin for OAuth handoff (env: PORTAL_FRONTEND_URL)

dr:
  provider: openpagerank           # free 0-10 domain rank, 30k domains/month
  cache_days: 30
  api_key_env: OPENPAGERANK_API_KEY

captcha:
  channel: cua                     # free channel: local real-Chrome automation
  solver_api: ""                   # optional fallback (2captcha/anticaptcha); empty = free-only
  api_key_env: SOLVER_API_KEY
  monthly_budget_usd: 0            # 0 = paid solving disabled
  email_code_imap: true

quotas:
  per_domain_per_day: 100          # R-530 convention
  per_project_per_day: 10
